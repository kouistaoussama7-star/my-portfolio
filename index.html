<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<style>
  :root{
    --charcoal: #17181a;
    --charcoal-2: #202225;
    --chrome-1: #e9edf0;
    --chrome-2: #9aa4ab;
    --chrome-3: #5c646b;
    --gold: #c9a227;
    --gold-soft: #e6c866;
    --teal: #1f6f6f;
    --off-white: #ede8de;
    --red: #b3372c;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--charcoal);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--off-white);
    -webkit-font-smoothing:antialiased;
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(31,111,111,0.25), transparent 60%),
      linear-gradient(180deg, var(--charcoal) 0%, var(--charcoal-2) 100%);
  }

  .hero{
    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio: 1 / 1;
    overflow:hidden;
    border-bottom: 2px solid rgba(201,162,39,0.35);
  }

  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter: saturate(0.95) contrast(1.03);
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(23,24,26,0) 45%, rgba(23,24,26,0.92) 96%);
  }

  .hero-label{
    position:absolute;
    left:20px;
    bottom:16px;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color: var(--gold-soft);
    font-weight:600;
  }

  .name{
    font-size:34px;
    font-weight:800;
    letter-spacing:-0.01em;
    color: var(--chrome-1);
    text-shadow: 0 2px 12px rgba(0,0,0,0.45);
  }

  .content{
    width:100%;
    max-width:480px;
    padding:28px 20px 48px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .tagline{
    text-align:center;
    font-size:13px;
    color: var(--chrome-2);
    letter-spacing:0.04em;
    margin: 2px 0 18px;
  }

  .tagline b{
    color: var(--gold-soft);
    font-weight:600;
  }

  /* Chrome armrest-style buttons, echoing the barber chair in the photo */
  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 20px;
    border-radius:14px;
    text-decoration:none;
    color: var(--charcoal);
    font-weight:700;
    font-size:16px;
    letter-spacing:0.01em;
    background: linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-2) 55%, var(--chrome-3) 100%);
    border: 1px solid rgba(0,0,0,0.25);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 -6px 10px rgba(0,0,0,0.18) inset,
      0 8px 18px rgba(0,0,0,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .link-btn:hover{
    transform: translateY(-2px);
    filter: brightness(1.04);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.65) inset,
      0 -6px 10px rgba(0,0,0,0.18) inset,
      0 12px 22px rgba(0,0,0,0.4);
  }

  .link-btn:active{
    transform: translateY(0px) scale(0.99);
  }

  .rivet{
    width:10px;
    height:10px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 60%, #8a6d15 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    flex-shrink:0;
  }

  .icon{
    width:26px;
    height:26px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{ width:100%; height:100%; }

  .label{
    flex:1;
  }

  .handle{
    font-weight:500;
    font-size:12px;
    opacity:0.65;
  }

  .instagram{ }
  .snapchat{ }
  .discord{ }

  .accent-bar{
    position:absolute;
    left:0; top:0; bottom:0;
    width:5px;
    border-radius:14px 0 0 14px;
  }
  .instagram .accent-bar{ background: linear-gradient(180deg,#feda75,#d62976,#4f5bd5); }
  .snapchat .accent-bar{ background: var(--gold-soft); }
  .discord .accent-bar{ background: var(--teal); }

  footer{
    margin-top:20px;
    text-align:center;
    font-size:11px;
    color: var(--chrome-3);
    letter-spacing:0.08em;
  }

  @media (prefers-reduced-motion: reduce){
    .link-btn{ transition:none; }
  }
</style>
</head>
