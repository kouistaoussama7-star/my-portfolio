<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samaae | Happy Halloween</title>
<meta name="description" content="Samaae - Happy Halloween">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='58' rx='42' ry='34' fill='%23ff7a18'/><rect x='46' y='14' width='9' height='16' rx='3' fill='%23558b2f'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<style>
  :root{--spooky:'Creepster','Chiller','Impact',system-ui,sans-serif;--font:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);color:#fff;background:linear-gradient(180deg,#0b0518,#1a0a2e 55%,#35104a) center/cover no-repeat;-webkit-font-smoothing:antialiased}
  #bg3d{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  :focus-visible{outline:2px solid #ff9a3c;outline-offset:4px;border-radius:12px}

  main{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;perspective:900px;
    padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
  .tilt{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;text-align:center}
  .bob{transform-style:preserve-3d;animation:bob 5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-8px)}50%{transform:translateY(10px)}}

  .happy{display:block;font-family:var(--spooky);font-size:clamp(1.8rem,7vw,3.4rem);letter-spacing:.18em;color:#ffe9c9;transform:translateZ(60px);
    text-shadow:0 0 18px rgba(255,200,120,.8),0 3px 0 #6a2a00,0 6px 12px rgba(0,0,0,.6)}
  .hw{display:block;font-family:var(--spooky);font-weight:400;font-size:clamp(3.2rem,15.5vw,9rem);line-height:1;letter-spacing:.04em;color:#ff9a2e;transform:translateZ(110px);
    text-shadow:0 1px 0 #d8620a,0 2px 0 #c75a08,0 3px 0 #b65207,0 4px 0 #a54a06,0 5px 0 #944205,0 6px 0 #833a04,0 7px 0 #723203,0 8px 0 #612a03,
      0 14px 18px rgba(0,0,0,.65),0 0 40px rgba(255,122,24,.85),0 0 90px rgba(255,90,0,.5);animation:flick 6s infinite}
  @keyframes flick{0%,90%,100%{opacity:1}92%{opacity:.65}94%{opacity:1}96%{opacity:.75}}
  .name{display:block;margin-top:14px;font-family:var(--spooky);font-size:clamp(2.4rem,9vw,4.6rem);letter-spacing:.12em;color:#e2c4ff;transform:translateZ(80px);
    text-shadow:0 2px 0 #4b1c85,0 4px 0 #3b1568,0 6px 0 #2c104d,0 10px 16px rgba(0,0,0,.6),0 0 30px rgba(170,100,255,.9)}
  .ig{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:13px 26px;border-radius:16px;font-weight:800;font-size:1rem;color:#fff;text-decoration:none;
    background:linear-gradient(45deg,#ff7a18,#e1306c 55%,#833ab4);transform:translateZ(70px);box-shadow:0 8px 0 #5a1d52,0 16px 28px rgba(0,0,0,.55),0 0 28px rgba(225,48,108,.5);
    transition:transform .15s,box-shadow .15s}
  .ig:hover{transform:translateZ(70px) translateY(-3px)}
  .ig:active{transform:translateZ(70px) translateY(5px);box-shadow:0 3px 0 #5a1d52,0 8px 16px rgba(0,0,0,.55)}
  .ig svg{width:22px;height:22px}

  #music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;padding:11px 18px;border-radius:14px;font:700 .88rem var(--font);color:#fff;cursor:pointer;
    background:rgba(14,8,24,.8);border:1px solid rgba(255,122,24,.4);box-shadow:0 0 18px rgba(255,122,24,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  #music:hover{background:rgba(255,122,24,.3)}
  #music.pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 30px rgba(255,122,24,.95)}}
  #yt{position:fixed;left:-300px;bottom:0;width:200px;height:200px;pointer-events:none;opacity:0}

  @media (prefers-reduced-motion:reduce){.bob,.hw,#music{animation:none!important}.tilt{transition:none}}
</style>
</head>
<body>
<canvas id="bg3d" aria-hidden="true"></canvas>

<main>
  <div class="tilt" id="tilt"><div class="bob">
    <span class="happy">HAPPY</span>
    <h1 class="hw">Halloween</h1>
    <span class="name">Days</span>
    <a class="ig" href="https://instagram.com/samaae.pr" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      Instagram
    </a>
  </div></div>
</main>

<div id="yt"><div id="ytp"></div></div>
<button id="music" type="button" class="pulse">&#127925; Tap to play music</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  'use strict';
  /* ====== SETTINGS ====== */
  var BG_IMAGE = '';   /* put your picture here, e.g. 'background.jpg' (or a full image URL) */
  var YT_URL   = 'https://youtu.be/60ItHLz5WEA?si=--2x0_s_jkl3gxsr';
  var VOLUME   = 60;

  if(BG_IMAGE){ document.body.style.backgroundImage = 'url("' + BG_IMAGE + '")'; }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ====== 3D SCENE ====== */
  var canvas = document.getElementById('bg3d');
  if(window.THREE){ try{ scene3d(); }catch(e){ canvas.style.display = 'none'; } } else { canvas.style.display = 'none'; }

  function scene3d(){
    var T = THREE;
    var renderer = new T.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    var scene = new T.Scene();
    if(!BG_IMAGE) scene.fog = new T.FogExp2(0x1a0a2e, 0.028);
    var cam = new T.PerspectiveCamera(55, 1, .1, 200); cam.position.set(0, 0, 12);

    scene.add(new T.AmbientLight(0x6a4c9c, .9));
    var moonLight = new T.DirectionalLight(0xbfc8ff, .9); moonLight.position.set(-6, 8, 6); scene.add(moonLight);

    /* moon + glow */
    var moonG = new T.Group();
    var moon = new T.Mesh(new T.SphereGeometry(2.2, 40, 30), new T.MeshBasicMaterial({color:0xfff1c2}));
    moonG.add(moon);
    var gc = document.createElement('canvas'); gc.width = gc.height = 128;
    var gx = gc.getContext('2d'), gr = gx.createRadialGradient(64,64,6,64,64,64);
    gr.addColorStop(0,'rgba(255,230,160,.95)'); gr.addColorStop(.4,'rgba(255,210,120,.35)'); gr.addColorStop(1,'rgba(255,200,100,0)');
    gx.fillStyle = gr; gx.fillRect(0,0,128,128);
    var glow = new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(gc), blending:T.AdditiveBlending, depthWrite:false}));
    glow.scale.set(11, 11, 1); moonG.add(glow);
    moonG.position.set(-6.5, 5, -14); scene.add(moonG);

    /* stars */
    var sp = new Float32Array(900 * 3);
    for(var i = 0; i < 900; i++){ sp[i*3] = (Math.random()-.5)*110; sp[i*3+1] = (Math.random()-.5)*60; sp[i*3+2] = -30 - Math.random()*50; }
    var sg = new T.BufferGeometry(); sg.setAttribute('position', new T.BufferAttribute(sp, 3));
    var stars = new T.Points(sg, new T.PointsMaterial({color:0xffffff, size:.18, transparent:true, opacity:.85, fog:false}));
    scene.add(stars);

    /* sparks rising */
    var N = 140, kp = new Float32Array(N * 3), kv = [];
    for(i = 0; i < N; i++){ kp[i*3] = (Math.random()-.5)*26; kp[i*3+1] = (Math.random()-.5)*16; kp[i*3+2] = (Math.random()-.5)*14; kv.push(.15 + Math.random()*.4); }
    var kg = new T.BufferGeometry(); kg.setAttribute('position', new T.BufferAttribute(kp, 3));
    scene.add(new T.Points(kg, new T.PointsMaterial({color:0xff9a2e, size:.12, transparent:true, opacity:.9, blending:T.AdditiveBlending, depthWrite:false})));

    /* pumpkins */
    function pumpkin(){
      var g = new T.Group();
      var geo = new T.SphereGeometry(1, 40, 30), pos = geo.attributes.position;
      for(var j = 0; j < pos.count; j++){
        var x = pos.getX(j), z = pos.getZ(j), a = Math.atan2(z, x), k = 1 + .075 * Math.cos(a * 10);
        pos.setX(j, x * k); pos.setZ(j, z * k);
      }
      geo.computeVertexNormals();
      var body = new T.Mesh(geo, new T.MeshStandardMaterial({color:0xf26a0f, roughness:.55, emissive:0x5a1c00, emissiveIntensity:.6}));
      body.scale.set(1.12, .88, 1.05); g.add(body);
      var stem = new T.Mesh(new T.CylinderGeometry(.09, .17, .42, 10), new T.MeshStandardMaterial({color:0x4d6b1f, roughness:.8}));
      stem.position.set(.04, .92, 0); stem.rotation.z = -.2; g.add(stem);
      var face = new T.MeshBasicMaterial({color:0xffd24a, side:T.DoubleSide});
      function poly(pts){ var s = new T.Shape(); s.moveTo(pts[0][0], pts[0][1]); for(var q = 1; q < pts.length; q++) s.lineTo(pts[q][0], pts[q][1]); s.closePath(); var m = new T.Mesh(new T.ShapeGeometry(s), face); m.position.z = 1.03; g.add(m); }
      poly([[-.55,.1],[-.15,.1],[-.35,.46]]); poly([[.15,.1],[.55,.1],[.35,.46]]);
      poly([[-.55,-.2],[-.3,-.1],[-.15,-.25],[0,-.1],[.15,-.25],[.3,-.1],[.55,-.2],[.4,-.55],[.2,-.4],[0,-.58],[-.2,-.4],[-.4,-.55]]);
      var l = new T.PointLight(0xff7a18, 1.1, 9); l.position.set(0, 0, .3); g.add(l);
      return g;
    }
    var defs = [[-6.2,-2.9,0,1.35],[6.4,-3.3,-1,1.55],[-3.4,3.7,-4,.8],[3.9,3.3,-3,.9],[0,-4.9,2,1.1]], pumps = [];
    defs.forEach(function(d, n){ var p = pumpkin(); p.scale.setScalar(d[3]); scene.add(p); pumps.push({g:p, d:d, ph:n * 1.3}); });

    /* bats */
    var R = [[0,.22],[.12,.3],[.22,.15],[.7,.28],[1.15,.05],[.95,0],[.8,.12],[.62,-.08],[.42,.06],[.2,-.22],[0,-.1]];
    var bs = new T.Shape(); bs.moveTo(R[0][0], R[0][1]);
    for(i = 1; i < R.length; i++) bs.lineTo(R[i][0], R[i][1]);
    for(i = R.length - 2; i >= 1; i--) bs.lineTo(-R[i][0], R[i][1]);
    bs.closePath();
    var bgeo = new T.ShapeGeometry(bs), bmat = new T.MeshBasicMaterial({color:0x050108, side:T.DoubleSide}), bats = [];
    for(i = 0; i < 6; i++){
      var b = new T.Mesh(bgeo, bmat), s = .7 + Math.random() * .8; b.scale.set(s, s, s);
      scene.add(b); bats.push({m:b, x:-20 + Math.random()*40, y:-2 + Math.random()*8, z:-6 + Math.random()*8, sp:1.2 + Math.random()*1.6, ph:Math.random()*6, s:s});
    }

    /* layout + resize */
    var spread = 1;
    function layout(){
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false); cam.aspect = w / h;
      spread = Math.min(1, cam.aspect / 1.5);
      cam.position.z = cam.aspect < 1 ? 15 : 12;
      cam.updateProjectionMatrix();
      moonG.position.x = -6.5 * Math.max(.55, spread);
    }
    layout(); window.addEventListener('resize', layout);

    var mx = 0, my = 0;
    window.addEventListener('pointermove', function(e){ mx = e.clientX / window.innerWidth * 2 - 1; my = e.clientY / window.innerHeight * 2 - 1; }, {passive:true});

    var clock = new T.Clock(), sk = reduce ? 0 : 1;
    (function loop(){
      requestAnimationFrame(loop);
      var t = clock.getElapsedTime() * sk;
      cam.position.x += (mx * 1.4 - cam.position.x) * .04;
      cam.position.y += (-my * .9 - cam.position.y) * .04;
      cam.lookAt(0, 0, 0);
      pumps.forEach(function(p){
        p.g.position.set(p.d[0] * spread, p.d[1] + Math.sin(t * .9 + p.ph) * .35, p.d[2]);
        p.g.rotation.y = Math.sin(t * .6 + p.ph) * .5; p.g.rotation.z = Math.sin(t * .7 + p.ph) * .06;
      });
      bats.forEach(function(b){
        var x = ((b.x + t * b.sp * 2 + 22) % 44) - 22;
        b.m.position.set(x, b.y + Math.sin(t * 1.3 + b.ph) * 1.2, b.z);
        b.m.scale.y = b.s * (.45 + .55 * Math.abs(Math.sin(t * 12 + b.ph)));
        b.m.rotation.z = Math.sin(t * 1.3 + b.ph) * .18;
      });
      var a = kg.attributes.position;
      for(var q = 0; q < N; q++){ var y = a.getY(q) + kv[q] * .02 * sk; if(y > 8) y = -8; a.setY(q, y); }
      a.needsUpdate = true;
      stars.rotation.z = t * .004; glow.material.opacity = .85 + Math.sin(t * 1.5) * .12;
      renderer.render(scene, cam);
    })();
  }

  /* ====== 3D TILT OF THE TEXT ====== */
  var tilt = document.getElementById('tilt');
  window.addEventListener('pointermove', function(e){
    var x = e.clientX / window.innerWidth - .5, y = e.clientY / window.innerHeight - .5;
    tilt.style.setProperty('--ry', (x * 22) + 'deg'); tilt.style.setProperty('--rx', (-y * 16) + 'deg');
  }, {passive:true});

  /* ====== MUSIC FROM YOUTUBE ====== */
  function ytId(u){ var m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : ''); }
  var player, ready = false, unlocked = false, wantOn = true, btn = document.getElementById('music');
  function label(){
    if(!unlocked){ btn.innerHTML = '&#127925; Tap to play music'; return; }
    btn.classList.remove('pulse'); btn.innerHTML = wantOn ? '&#127925; Music: ON' : '&#128263; Music: OFF';
  }
  function fadeIn(){ var v = 0; player.setVolume(0); var t = setInterval(function(){ v += 4; if(v >= VOLUME){ v = VOLUME; clearInterval(t); } player.setVolume(v); }, 180); }
  function unlock(){ if(!ready || unlocked || !wantOn) return; unlocked = true; try{ player.unMute(); player.playVideo(); fadeIn(); }catch(e){} label(); }
  window.onYouTubeIframeAPIReady = function(){
    var id = ytId(YT_URL); if(!id) return;
    player = new YT.Player('ytp', {width:'200', height:'200', videoId:id,
      playerVars:{autoplay:1, controls:0, loop:1, playlist:id, playsinline:1, rel:0, modestbranding:1},
      events:{onReady:function(){ ready = true; player.mute(); player.playVideo(); }, onStateChange:function(e){ if(e.data === 0) player.playVideo(); }}});
  };
  var ys = document.createElement('script'); ys.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(ys);
  ['pointerdown','touchstart','keydown','click'].forEach(function(ev){
    window.addEventListener(ev, function(e){ if(e.target && e.target.closest && e.target.closest('#music')) return; unlock(); }, {passive:true});
  });
  btn.addEventListener('click', function(){
    if(!ready) return;
    if(!unlocked){ wantOn = true; unlock(); return; }
    wantOn = !wantOn;
    if(wantOn){ player.unMute(); player.playVideo(); fadeIn(); } else { player.pauseVideo(); }
    label();
  });
  label();
})();
</script>
</body>
</html>
